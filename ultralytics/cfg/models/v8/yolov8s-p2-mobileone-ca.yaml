nc: 2
scales:
  s: [ 0.33, 0.50, 1024 ]
backbone:
  # [from, repeats, module, args]
  - [ -1, 1, Conv, [ 64, 3, 2 ] ] # 0-P1/2
  - [ -1, 1, Conv, [ 128, 3, 2 ] ] # 1-P2/4
  - [ -1, 3, C2f_MobileOne, [ 128, True ] ]
  - [ -1, 1, Conv, [ 256, 3, 2 ] ] # 3-P3/8
  - [ -1, 6, C2f_MobileOne, [ 256, True ] ]
  - [ -1, 1, Conv, [ 512, 3, 2 ] ] # 5-P4/16
  - [ -1, 6, C2f_MobileOne, [ 512, True ] ]
  - [ -1, 1, Conv, [ 1024, 3, 2 ] ] # 7-P5/32
  - [ -1, 3, C2f_MobileOne, [ 1024, True ] ]
  - [ -1, 1, SPPF, [ 1024, 5 ] ] # 9
  - [ -1, 1, CoordAtt, [ 1024 ] ] # 新增主干P5 CA，增强全局特征

head:
  - [ -1, 1, nn.Upsample, [ None, 2, "nearest" ] ]
  - [ [ -1, 6 ], 1, Concat, [ 1 ] ] # cat backbone P4
  - [ -1, 3, C2f_MobileOne, [ 512 ] ] # 12

  - [ -1, 1, nn.Upsample, [ None, 2, "nearest" ] ]
  - [ [ -1, 4 ], 1, Concat, [ 1 ] ] # cat backbone P3
  - [ -1, 3, C2f_MobileOne, [ 256 ] ] # 15 (P3/8-small)

  - [ -1, 1, nn.Upsample, [ None, 2, "nearest" ] ]
  - [ [ -1, 2 ], 1, Concat, [ 1 ] ] # cat backbone P2
  - [ -1, 3, C2f_MobileOne, [ 128 ] ] # 18 (P2/4-xsmall)
  - [ -1, 1, CoordAtt, [ 128 ] ] # 19

  - [ -1, 1, Conv, [ 128, 3, 2 ] ]
  - [ [ -1, 15 ], 1, Concat, [ 1 ] ] # cat head P3
  - [ -1, 3, C2f_MobileOne, [ 256 ] ] # 22 (P3/8-small)
  - [ -1, 1, CoordAtt, [ 256 ] ] # 23

  - [ -1, 1, Conv, [ 256, 3, 2 ] ]
  - [ [ -1, 12 ], 1, Concat, [ 1 ] ] # cat head P4
  - [ -1, 3, C2f_MobileOne, [ 512 ] ] # 26 (P4/16-medium)
  - [ -1, 1, CoordAtt, [ 512 ] ] # 27

  - [ -1, 1, Conv, [ 512, 3, 2 ] ]
  - [ [ -1, 10 ], 1, Concat, [ 1 ] ] # cat backbone P5，注意这里from改成10
  - [ -1, 3, C2f_MobileOne, [ 1024 ] ] # 30 (P5/32-large)
  - [ -1, 1, CoordAtt, [ 1024 ] ] # 31

  - [ [ 19, 23, 27, 31 ], 1, Detect, [ nc ] ] # Detect(P2, P3, P4, P5)
