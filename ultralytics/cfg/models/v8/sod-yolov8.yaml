# SOD-YOLOv8: YOLOv8 with a P2 detection layer, GFPN-style fusion, and C2f-EMA.
# Reference: https://www.mdpi.com/1424-8220/24/19/6209

nc: 80
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f_EMA, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9

head:
  - [-1, 1, Conv, [512, 1, 1]] # 10
  - [6, 1, Conv, [512, 3, 2]] # 11
  - [[-1, 10], 1, Concat, [1]] # 12
  - [-1, 3, C2f_EMA, [512]] # 13-P5/32

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [4, 1, Conv, [256, 3, 2]] # 15
  - [[14, -1, 6], 1, Concat, [1]] # 16
  - [-1, 3, C2f_EMA, [512]] # 17-P4/16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 18
  - [[-1, 4], 1, Concat, [1]] # 19
  - [-1, 3, C2f_EMA, [256]] # 20-P3/8

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 21
  - [[-1, 2], 1, Concat, [1]] # 22
  - [-1, 3, C2f_EMA, [128]] # 23-P2/4

  - [-1, 1, Conv, [128, 3, 2]] # 24
  - [[-1, 20], 1, Concat, [1]] # 25
  - [-1, 3, C2f_EMA, [256]] # 26-P3/8

  - [-1, 1, Conv, [256, 3, 2]] # 27
  - [[-1, 17], 1, Concat, [1]] # 28
  - [-1, 3, C2f_EMA, [512]] # 29-P4/16

  - [17, 1, Conv, [256, 3, 2]] # 30
  - [29, 1, Conv, [256, 3, 2]] # 31
  - [[13, 30, -1], 1, Concat, [1]] # 32
  - [-1, 3, C2f_EMA, [1024]] # 33-P5/32

  - [[23, 26, 29, 33], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)
