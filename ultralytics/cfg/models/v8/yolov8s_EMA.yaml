# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8s + EMA (推荐配置：Backbone末端 + Neck三个C2f后)

# Parameters
nc: 2  # 改成你的类别数
scales:
  s: [ 0.33, 0.50, 1024 ]  # YOLOv8s

# YOLOv8.0s backbone
backbone:
  # [from, repeats, module, args]
  - [ -1, 1, Conv, [ 64, 3, 2 ] ]  # 0-P1/2
  - [ -1, 1, Conv, [ 128, 3, 2 ] ]  # 1-P2/4
  - [ -1, 3, C2f, [ 128, True ] ]
  - [ -1, 1, Conv, [ 256, 3, 2 ] ]  # 3-P3/8
  - [ -1, 6, C2f, [ 256, True ] ]
  - [ -1, 1, Conv, [ 512, 3, 2 ] ]  # 5-P4/16
  - [ -1, 6, C2f, [ 512, True ] ]
  - [ -1, 1, Conv, [ 1024, 3, 2 ] ]  # 7-P5/32
  - [ -1, 3, C2f, [ 1024, True ] ]
  - [ -1, 1, SPPF, [ 1024, 5 ] ]  # 9
  - [ -1, 1, EMA, [ ] ]           # 10  ← Backbone末端 EMA

# YOLOv8.0s head
head:
  - [ -1, 1, nn.Upsample, [ None, 2, 'nearest' ] ]
  - [ [ -1, 6 ], 1, Concat, [ 1 ] ]  # cat backbone P4
  - [ -1, 3, C2f, [ 512 ] ]        # 13
  - [ -1, 1, EMA, [ ] ]           # 14  ← Neck P4 EMA

  - [ -1, 1, nn.Upsample, [ None, 2, 'nearest' ] ]
  - [ [ -1, 4 ], 1, Concat, [ 1 ] ]  # cat backbone P3
  - [ -1, 3, C2f, [ 256 ] ]        # 17
  - [ -1, 1, EMA, [ ] ]           # 18  ← Neck P3 EMA (小目标关键)

  - [ -1, 1, Conv, [ 256, 3, 2 ] ]
  - [ [ -1, 14 ], 1, Concat, [ 1 ] ] # cat head P4
  - [ -1, 3, C2f, [ 512 ] ]        # 21
  - [ -1, 1, EMA, [ ] ]           # 22  ← Neck P4 EMA

  - [ -1, 1, Conv, [ 512, 3, 2 ] ]
  - [ [ -1, 10 ], 1, Concat, [ 1 ] ] # cat head P5
  - [ -1, 3, C2f, [ 1024 ] ]       # 25
  - [ -1, 1, EMA, [ ] ]           # 26  ← Neck P5 EMA

  - [ [ 18, 22, 26 ], 1, Detect, [ nc ] ]  # Detect(P3, P4, P5)