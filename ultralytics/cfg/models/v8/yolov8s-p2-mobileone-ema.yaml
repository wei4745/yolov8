nc: 2
scales:
  s: [ 0.33, 0.50, 1024 ]
backbone:
  - [ -1, 1, Conv, [ 64, 3, 2 ] ] # 0-P1/2
  - [ -1, 1, Conv, [ 128, 3, 2 ] ] # 1-P2/4
  - [ -1, 3, C2f_MobileOne, [ 128, True ] ]
  - [ -1, 1, Conv, [ 256, 3, 2 ] ] # 3-P3/8
  - [ -1, 6, C2f_MobileOne, [ 256, True ] ]
  - [ -1, 1, Conv, [ 512, 3, 2 ] ] # 5-P4/16
  - [ -1, 6, C2f_MobileOne, [ 512, True ] ]
  - [ -1, 1, Conv, [ 1024, 3, 2 ] ] # 7-P5/32
  - [ -1, 3, C2f_MobileOne, [ 1024, True ] ]
  - [ -1, 1, SPPF, [ 1024, 5 ] ] # 9
  - [ -1, 1, EMA, [ 1024 ] ]     # 10 主干P5加EMA

head:
  - [ -1, 1, nn.Upsample, [ None, 2, "nearest" ] ]
  - [ [ -1, 6 ], 1, Concat, [ 1 ] ] # cat backbone P4
  - [ -1, 3, C2f_MobileOne, [ 512 ] ] # 13

  - [ -1, 1, nn.Upsample, [ None, 2, "nearest" ] ]
  - [ [ -1, 4 ], 1, Concat, [ 1 ] ] # cat backbone P3
  - [ -1, 3, C2f_MobileOne, [ 256 ] ] # 17 (P3/8-small)
  - [ -1, 1, EMA, [ 256 ] ]     # 18 P3小目标加EMA

  - [ -1, 1, nn.Upsample, [ None, 2, "nearest" ] ]
  - [ [ -1, 2 ], 1, Concat, [ 1 ] ] # cat backbone P2
  - [ -1, 3, C2f_MobileOne, [ 128 ] ] # 21 (P2/4-xsmall)
  - [ -1, 1, EMA, [ 128 ] ]     # 22 P2极小目标加EMA

  - [ -1, 1, Conv, [ 128, 3, 2 ] ]
  - [ [ -1, 18 ], 1, Concat, [ 1 ] ] # cat head P3
  - [ -1, 3, C2f_MobileOne, [ 256 ] ] # 25 (P3/8-small)

  - [ -1, 1, Conv, [ 256, 3, 2 ] ]
  - [ [ -1, 14 ], 1, Concat, [ 1 ] ] # cat head P4
  - [ -1, 3, C2f_MobileOne, [ 512 ] ] # 29 (P4/16-medium)

  - [ -1, 1, Conv, [ 512, 3, 2 ] ]
  - [ [ -1, 10 ], 1, Concat, [ 1 ] ] # cat head P5
  - [ -1, 3, C2f_MobileOne, [ 1024 ] ] # 33 (P5/32-large)

  - [ [ 22, 25, 29, 33 ], 1, Detect, [ nc ] ] # Detect(P2, P3, P4, P5)
